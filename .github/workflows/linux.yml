name: linux
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  linux:
    name: "Linux PHP ${{ matrix.php }}"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3", "8.4"]
    env:
      PHP: ${{ matrix.php }}
      GITHUB: "yes"
      enable_debug: "yes"
      TEST_PHP_ARGS: "--show-diff"
      REPORT_EXIT_STATUS: "yes"
      NO_INTERACTION: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
          re2c \
          libz-dev

      - name: Prepare
        run: |
          phpize

      - name: Configure
        run: |
          ./configure --enable-beacon

      - name: Build
        run: |
          make -j$(nproc)

      - name: Test
        run: |
          make test

      - name: E2E registry lifecycle
        run: |
          bash tests/e2e/registry-lifecycle.sh
